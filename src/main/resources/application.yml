server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: calculator-backend

  # 数据库连接：敏感信息走环境变量，不要写死在代码或提交到 GitHub
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/calculator_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000

  jpa:
    hibernate:
      # 开发期自动建表/加字段；生产环境建议改成 validate 并手动执行 db/schema.sql
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: always

# 计算器业务参数
app:
  calculator:
    # 除法结果保留的小数位数
    division-scale: 10
    # 允许的最大括号嵌套层数，防止恶意超深表达式导致栈溢出
    max-nesting-depth: 50
    # 表达式最大长度
    max-expression-length: 200
  cors:
    # 允许跨域的前端地址（多个用逗号分隔）。生产环境走 Nginx 同源反向代理时可留空
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    root: info
    com.fzu.calculator: debug
